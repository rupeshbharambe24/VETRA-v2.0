# YOLOv8-pose dataset config, back view (8 keypoints, single class "animal").
# yolo_back/ is generated by notebooks/yolo-model.ipynb (Step 1.5) at the repo root and is git-ignored.
# Paths are relative to this file; the notebook regenerates this YAML with absolute paths when it runs.
train: ../yolo_back/images/train
val: ../yolo_back/images/val
test: ../yolo_back/images/test
kpt_shape: [8, 2]
names: [animal]
num_keypoints: 8
skeleton:
- [0, 1]
- [2, 3]
- [0, 2]
- [1, 3]
- [4, 5]
- [2, 6]
- [3, 7]
view_type: back
