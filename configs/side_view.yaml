# YOLOv8-pose dataset config, side view (10 keypoints, single class "animal").
# yolo_side/ is generated by notebooks/yolo-model.ipynb (Step 1.5) at the repo root and is git-ignored.
# Paths are relative to this file; the notebook regenerates this YAML with absolute paths when it runs.
train: ../yolo_side/images/train
val: ../yolo_side/images/val
test: ../yolo_side/images/test
kpt_shape: [10, 2]
names: [animal]
num_keypoints: 10
skeleton:
- [0, 9]
- [2, 4]
- [5, 6]
- [1, 7]
- [1, 8]
- [3, 4]
view_type: side
